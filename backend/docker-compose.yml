services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: myai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    depends_on: [postgres, redis]
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=myai;Username=postgres;Password=postgres"
      Encryption__Key: "dev-encryption-key-change-in-production"
      Redis__Endpoint: "redis:6379"
    ports: ["5000:8080"]
volumes:
  pgdata:
